name: 签署 WinDrop 拆分版 iOS 快捷指令（需自托管 Mac）

# 说明：Apple 官方 shortcuts sign --mode anyone 强制要求当前 macOS 已登录 iCloud，
# GitHub 免费云端 Mac 虚拟机未登录 iCloud 会报错 "you must be signed into iCloud"。
# 因此关闭 push 自动触发以避免仓库红叉；如拥有已登录 iCloud 的 Mac（或 self-hosted runner），可手动触发此工作流。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign-shortcuts:
    runs-on: [self-hosted, macos]
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 校验并转换 Plist 后调用 Apple 官方 shortcuts 签名
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/shortcuts"

          plutil -lint "$PWD/发送到电脑.shortcut"
          plutil -lint "$PWD/从电脑接收.shortcut"
          plutil -convert binary1 "$PWD/发送到电脑.shortcut" -o "$PWD/send_bin.shortcut"
          plutil -convert binary1 "$PWD/从电脑接收.shortcut" -o "$PWD/recv_bin.shortcut"

          shortcuts sign --mode anyone --input "$PWD/send_bin.shortcut" --output "$PWD/WinDrop-Send.shortcut"
          shortcuts sign --mode anyone --input "$PWD/recv_bin.shortcut" --output "$PWD/WinDrop-Receive.shortcut"

          python3 - <<'PY'
          from pathlib import Path

          for name in ("WinDrop-Send.shortcut", "WinDrop-Receive.shortcut"):
              data = Path(name).read_bytes()
              assert data[:4] == b"AEA1", f"{name} 未包含 Apple AEA1 签名文件头"
              print(f"{name}: {len(data)} bytes, header={data[:4]!r}")
          PY

      - name: 上传已签名快捷指令构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WinDrop-Signed-Shortcuts
          path: |
            shortcuts/WinDrop-Send.shortcut
            shortcuts/WinDrop-Receive.shortcut

      - name: 发布免登录直链 Release (shortcuts-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view shortcuts-latest >/dev/null 2>&1; then
            gh release upload shortcuts-latest \
              "shortcuts/WinDrop-Send.shortcut" \
              "shortcuts/WinDrop-Receive.shortcut" \
              --clobber
          else
            gh release create shortcuts-latest \
              "shortcuts/WinDrop-Send.shortcut" \
              "shortcuts/WinDrop-Receive.shortcut" \
              --title "WinDrop 已签名拆分版 iOS 快捷指令" \
              --notes "由已登录 iCloud 的 macOS 环境通过 Apple 官方 shortcuts sign --mode anyone 自动签名生成。"
          fi
