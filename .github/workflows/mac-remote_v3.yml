name: mac-remote
# 用法：把本文件放到仓库.github/workflows/mac-remote.yml
# 然后在 GitHub 仓库 Actions 页手动 Run workflow，
# 打开运行日志里的 tmate 步骤，里面有 SSH 命令和网页终端链接。
# 注意：本版已去掉 limit-access-to-actor，只能放在里用，
# 用完立刻 Cancel workflow，不要把日志里的连接串外传。
on:
workflow_dispatch:
jobs:
mac:
runs-on: macos-15 # Apple Silicon (M1)；要 Intel 改 macos-15-intel
timeout-minutes: 350 # 单个 job 上限 6 小时，留余量填 350
steps:
- name: Start tmate session
uses: mxschmitt/action-tmate@v3
